apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-nodejs-app
  labels:
    app: devops-nodejs-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-nodejs-app
  template:
    metadata:
      labels:
        app: devops-nodejs-app
    spec:
      containers:
        - name: devops-nodejs-app
          image: 635054837309.dkr.ecr.us-east-1.amazonaws.com/devops-nodejs-app:1.0
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"